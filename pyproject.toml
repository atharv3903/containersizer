[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csizer"
version = "0.1.0"
description = "ContainerSizer v2: performance modelling and SLA-driven sizing of Dockerised web servers"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.4"]

[project.scripts]
csizer = "csizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["realdata: needs the imported v1 dataset under data/v1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # literal httperf logs are long lines

[tool.ruff.lint.isort]
known-first-party = ["csizer", "conftest"]
